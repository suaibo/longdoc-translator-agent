services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: longdoc
      POSTGRES_PASSWORD: longdoc
      POSTGRES_DB: longdoc_translator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longdoc -d longdoc_translator"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - longdoc_postgres_data:/var/lib/postgresql/data

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: longdoc
      POSTGRES_PASSWORD: longdoc
      POSTGRES_DB: longdoc_translator_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longdoc -d longdoc_translator_test"]
      interval: 3s
      timeout: 5s
      retries: 10
    profiles: ["test"]

volumes:
  longdoc_postgres_data:
